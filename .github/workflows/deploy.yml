name: Deploy to S3 and CloudFront

on:
  push:
    branches:
      - main
      - production
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get S3 bucket name from Terraform
        id: terraform
        run: |
          cd terraform
          terraform init -backend=false
          BUCKET_NAME=$(terraform output -raw s3_bucket_name)
          DIST_ID=$(terraform output -raw cloudfront_distribution_id)
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "distribution_id=$DIST_ID" >> $GITHUB_OUTPUT

      - name: Upload to S3
        run: |
          aws s3 sync dist/ s3://${{ steps.terraform.outputs.bucket_name }} \
            --delete \
            --cache-control "max-age=3600" \
            --exclude "*.html" \
            --exclude ".git*"
          
          aws s3 sync dist/ s3://${{ steps.terraform.outputs.bucket_name }} \
            --cache-control "max-age=0" \
            --include "*.html" \
            --exclude "*" --include "*.html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.terraform.outputs.distribution_id }} \
            --paths '/*'

      - name: Get deployment URL
        id: deployment
        run: |
          cd terraform
          DOMAIN=$(terraform output -raw website_domain)
          echo "url=https://$DOMAIN" >> $GITHUB_OUTPUT

      - name: Deploy status
        run: |
          echo "✅ Deployment Complete"
          echo "🌐 URL: ${{ steps.deployment.outputs.url }}"
          echo "📦 Bucket: ${{ steps.terraform.outputs.bucket_name }}"
          echo "🚀 Distribution: ${{ steps.terraform.outputs.distribution_id }}"

      - name: Post deployment notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Deployment ${{ job.status }}: ${{ steps.deployment.outputs.url }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author
        continue-on-error: true
